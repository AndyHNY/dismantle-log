<style>
/* Layout: workshop tablet tool. Sticky job bar, one big card per question, thumb-sized controls at the bottom. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --sunk:#e2e6df; --line:#c9cfc4;
  --ink:#1c2420; --ink-2:#4f5a53; --accent:#e8a31a; --accent-ink:#1c2420;
  --good:#2f7d4f; --warn:#b5651d; --bad:#b23a32; --info:#3b6a8f; --bar:#1c2420; --bar-ink:#eef0ec;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1d2521; --sunk:#252f2a; --line:#36423b;
  --ink:#e6ebe6; --ink-2:#a3aea6; --accent:#f0b43a; --accent-ink:#141a17;
  --good:#5cb37f; --warn:#e0954e; --bad:#e2675d; --info:#79a9d1; --bar:#0b0f0d; --bar-ink:#e6ebe6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --sunk:#252f2a; --line:#36423b;
  --ink:#e6ebe6; --ink-2:#a3aea6; --accent:#f0b43a; --accent-ink:#141a17;
  --good:#5cb37f; --warn:#e0954e; --bad:#e2675d; --info:#79a9d1; --bar:#0b0f0d; --bar-ink:#e6ebe6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.bar-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-size:24px;letter-spacing:.02em;margin:0;flex:1;min-width:0;text-wrap:balance}
.bar .sub{font-size:14px;opacity:.8;width:100%}
.bar button{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent);color:var(--bar-ink);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
h2{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-size:20px;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{min-height:52px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.part:focus-visible{outline:3px solid var(--info);outline-offset:2px}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);font-size:19px}
textarea{min-height:150px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.progress{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;cursor:pointer;text-align:left;width:100%;min-height:68px}
.part .stripe{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.part .nm{font-weight:600;font-size:18px}
.chip{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-todo{color:var(--ink-2)} .s-prog{color:var(--info)} .s-done{color:var(--good)} .s-dmg{color:var(--warn)} .s-np{color:var(--ink-2)} .s-pend{color:var(--bad)}
.stripe.s-done{background:var(--good)} .stripe.s-prog{background:var(--info)} .stripe.s-dmg{background:var(--warn)} .stripe.s-pend{background:var(--bad)} .stripe.s-np{background:var(--line)}
.q{font-family:var(--display);font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.stepno{font-family:var(--mono);font-size:14px;color:var(--ink-2);letter-spacing:.05em}
.choices{display:grid;gap:10px}
.choices.c3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.choices.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice{min-height:84px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left}
.choice b{font-family:var(--display);font-size:26px;line-height:1}
.choice span{font-size:14px;color:var(--ink-2)}
.choice[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px}
.navbar .btn{flex:1}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.info dt{color:var(--ink-2);font-size:14px;padding-top:2px}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.warnbox{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));padding:10px 12px;border-radius:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .lbl{position:absolute;left:0;bottom:0;right:0;background:color-mix(in srgb,var(--ink) 75%,transparent);color:var(--bg);font-family:var(--mono);font-size:11px;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb button{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:99px;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer}
.check{display:flex;gap:12px;align-items:center;min-height:60px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--r);cursor:pointer;font-weight:600;background:var(--surface)}
.check input{width:28px;height:28px;accent-color:var(--good)}
.review{display:flex;flex-direction:column;gap:0}
.review button{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer;min-height:52px}
.review button span:first-child{color:var(--ink-2);font-size:15px}
.review button span:last-child{overflow-wrap:anywhere}
.missing{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.sample{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px dashed var(--accent);padding:8px 12px;border-radius:8px;font-size:14px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:560px;max-height:90vh;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:40px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);cursor:pointer}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-size:28px;display:block;line-height:1}
@media (prefers-reduced-motion: no-preference){.choice,.btn{transition:background .12s,border-color .12s}}
</style>

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
const mem = {jobs:new Map(), photos:new Map(), kv:new Map()};
let idb = null;
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("dismantle-log",1);
      r.onupgradeneeded = ()=>{const d=r.result;["jobs","photos","kv"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null); r.onblocked=()=>res(null);
    }catch(e){res(null)}
  });
}
function tx(store,mode,fn){
  if(!idb) return Promise.resolve(fn(null,store));
  return new Promise((res,rej)=>{
    try{const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);
      t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}catch(e){rej(e)}
  });
}
const db = {
  async put(store,key,val){ if(!idb){mem[store].set(key,val);return} await tx(store,"readwrite",s=>s.put(val,key)); },
  async get(store,key){ if(!idb) return mem[store].get(key); return tx(store,"readonly",s=>s.get(key)); },
  async del(store,key){ if(!idb){mem[store].delete(key);return} await tx(store,"readwrite",s=>s.delete(key)); },
  async all(store){ if(!idb) return [...mem[store].values()]; return tx(store,"readonly",s=>s.getAll()); }
};

/* ---------- Excel import (office) ---------- */
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res,rej)=>{const urls=["xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"];
    const tryNext=()=>{const u=urls.shift();if(!u){rej(new Error("Couldn't load the spreadsheet reader. Connect to Wi-Fi and try again."));return}
      const s=document.createElement("script");s.src=u;s.onload=()=>window.XLSX?res():tryNext();s.onerror=()=>{s.remove();tryNext()};document.head.appendChild(s)};
    tryNext()});
}
async function importWorkbook(file){
  await loadSheetJS();
  const wb = XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const det = wb.Sheets["1 Details"], pl = wb.Sheets["2 Parts List"], wo = wb.Sheets["3 Work Order"];
  if(!det||!pl) throw new Error("This doesn't look like the Acquisition Dismantling Workflow file. It needs the '1 Details' and '2 Parts List' tabs.");
  const cell=(ws,a)=>{const c=ws[a];if(!c||c.v==null)return"";return c.v instanceof Date?c.v.toISOString().slice(0,10):String(c.w&&typeof c.v==="number"&&!/^[\d.]+$/.test(c.w)?c.v:c.v).trim()};
  const d={};
  for(let r=5;r<=40;r++){const lbl=cell(det,"B"+r).toLowerCase();if(!lbl)continue;
    const f=DETAIL_FIELDS.find(([k,l])=>lbl.startsWith(l.toLowerCase().slice(0,14)));
    if(f&&d[f[0]]===undefined) d[f[0]]=cell(det,"C"+r);}
  if(!d.jobNo) throw new Error("Fill in the Job / Stock Number on the '1 Details' tab first.");
  const job={id:uid(),details:Object.assign(Object.fromEntries(DETAIL_FIELDS.map(([k])=>[k,""])),d),created:Date.now(),parts:[]};
  const woBy={};
  const woRow={};
  if(wo) for(let r=7;r<=400;r++){const w={instructions:cell(wo,"G"+r),tools:cell(wo,"H"+r),estMins:cell(wo,"I"+r),warnings:cell(wo,"J"+r)};woRow[r]=w;const pid=cell(wo,"B"+r);if(pid)woBy[pid]=w}
  for(let r=7;r<=400;r++){
    const name=cell(pl,"C"+r); if(!name) continue;
    if(cell(pl,"J"+r).toLowerCase()==="no") continue;
    const line=parseInt(cell(pl,"A"+r))||(r-6);
    const id=cell(pl,"B"+r)||(d.jobNo+"-"+pad3(line));
    job.parts.push(newPart(job,line,Object.assign({id,name,category:cell(pl,"D"+r),location:cell(pl,"E"+r),qty:cell(pl,"F"+r)||1,notes:cell(pl,"G"+r),price:cell(pl,"H"+r),priority:cell(pl,"I"+r)},woBy[id]||woRow[r]||{})));
  }
  if(!job.parts.length) throw new Error("No parts found on the '2 Parts List' tab.");
  return job;
}

function resizePhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Couldn't process that photo.")),"image/jpeg",0.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Couldn't read that photo."))};
    img.src=url;
  });
}

  job.parts.filter(isActive).forEach(p=>{const a=p.answers;rows.push([p.id,p.name,p.location,p.doneAt?STATUS_TXT[a.status]:"No",a.grade||"",a.obs||"",a.damageYN==="yes"?a.damage:(a.damageYN==="no"?"None":""),a.oemNone?"Not found":(a.oem||""),a.alt||"",a.maker||"",p.doneAt?Math.round(p.timeSecs/60):"",p.dateRemoved||"",p.initials||"",(p.photos||[]).length,a.photosToFollow?"Yes":"",p.extra?"Yes":p.salvagedFrom?"Removed from "+(job.parts.find(x=>x.uid===p.salvagedFrom)?.id||""):"",p.extra?.approvedBy||""])});
  return rows;
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){ // files: [{name, data:Uint8Array|string|Blob}]
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const now=new Date(),dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)),dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate());
  for(const f of files){
    const data=typeof f.data==="string"?enc.encode(f.data):f.data instanceof Blob?new Uint8Array(await f.data.arrayBuffer()):f.data;
    const name=enc.encode(f.name),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const csize=central.reduce((s,u)=>s+u.length,0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/zip"});
}
async function offerFile(filename,blob){
  try{ if(window.claude&&claude.use){ const dl=await claude.use("downloads"); if(dl){ await dl.save({filename,data:blob}); return true; } } }
  catch(e){ if(e&&e.code==="declined"){toast("Save cancelled");return false} if(e&&e.code&&e.code!=="unavailable"&&e.code!=="not_granted"){toast("Couldn't save: "+(e.message||e.code));return false} }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
function stamp(){const n=new Date();return n.toISOString().slice(0,10)+"_"+String(n.getHours()).padStart(2,"0")+String(n.getMinutes()).padStart(2,"0")}
async function exportJob(kind){
  const job=S.job;
  const list = kind==="new" ? job.parts.filter(needsSend) : job.parts.filter(goesLive);
  if(kind==="new"&&!list.length){toast("Nothing new to send");return}
  const files=[{name:`${job.details.jobNo}_stock.csv`,data:"﻿"+toCSV([STOCK_COLS,...list.map(p=>stockRow(job,p))])}];
  if(kind==="full") files.push({name:`${job.details.jobNo}_dismantle-log.csv`,data:"﻿"+toCSV(logRows(job))});
  const photoParts = kind==="new"?list:job.parts.filter(p=>isActive(p)&&p.id);
  for(const p of photoParts) for(let i=0;i<(p.photos||[]).length;i++){const b=await db.get("photos",p.photos[i]);if(b)files.push({name:`photos/${photoName(p,i)}`,data:b})}
  const zip=await makeZip(files);
  const ok=await offerFile(`${job.details.jobNo}_${kind==="new"?"new-parts":"full-job"}_${stamp()}.zip`,zip);
  if(ok&&kind==="new"){const t=Date.now();list.forEach(p=>p.exportedAt=t);job.lastExport=t;await saveJob(job);toast(`${list.length} part${list.length>1?"s":""} ready to upload`);render()}
}

/* ---------- wizard ---------- */
function steps(p){
  const s=["info","status"];
  if(!p.answers.status||p.answers.status!=="notpresent"){if(p.answers.grade==="D")s.push("grade","obs","damage","salvage");else s.push("grade","oem","alt","maker","obs","damage","photos")}
  s.push("review"); return s;
}
function stepValid(p,st){
  const a=p.answers;
  switch(st){
    case "status": return !!a.status;
    case "grade": return !!a.grade;
    case "oem": return !!(a.oemNone||(a.oem&&a.oem.trim()));
    case "maker": return !!(a.maker&&a.maker.trim());
    case "obs": return true;
    case "damage": return a.damageYN==="no"||(a.damageYN==="yes"&&!!(a.damage&&a.damage.trim()));
    case "photos": return !!a.photosToFollow||(!!a.prepped&&(p.photos||[]).length>0);
    default: return true;
  }
}
const STEP_LABEL={status:"What happened",grade:"Condition",oem:"OEM / part number",alt:"Other numbers",maker:"Manufacturer / brand",obs:"Observations",damage:"Damage",photos:"Photos",salvage:"Removed before scrapping"};
function reviewValue(p,st){
  const a=p.answers;
  switch(st){
    case "status": return {removed:"Removed",damaged:"Damaged",notpresent:"Not present"}[a.status];
    case "grade": return a.grade&&`Grade ${a.grade}`;
    case "oem": return a.oemNone?"Couldn't find one":a.oem;
    case "alt": return a.alt||"None";
    case "maker": return a.maker;
    case "obs": return a.obs||"Nothing to add";
    case "salvage": {const n=S.job.parts.filter(x=>x.salvagedFrom===p.uid).length;return n?`${n} part${n>1?"s":""} added to the work order`:"Nothing";}
    case "damage": return a.damageYN==="no"?"None":a.damageYN==="yes"?a.damage:"";
    case "photos": return a.photosToFollow?"Photos to follow":(p.photos||[]).length?`${p.photos.length} photo${p.photos.length>1?"s":""}`:"";
  }
}

  const valid=stepValid(p,st), allValid=ss.every(s=>stepValid(p,s));
  const next = st==="review" ? `<button class="btn primary" data-act="finish" ${allValid?"":"disabled"}>${p.doneAt?"Save changes":"Done"}</button>` : `<button class="btn primary" data-act="next" ${valid?"":"disabled"}>${st==="info"?"Start":"Next"}</button>`;
  return bar(esc(p.name),`${p.id?`<span class="mono">${esc(p.id)}</span> · `:""}${qi>=0?`Question ${qi+1} of ${qs.length}`:st==="review"?"Review":"Work order"}`,`<button data-act="closepart">Parts</button>`)+`<main class="wrap"><section class="card">${body}</section></main>
  <nav class="navbar"><div class="in"><button class="btn" data-act="back" ${S.step===0?"disabled":""}>Back</button>${next}</div></nav>`;
}
function vListings(){
  const j=S.job,list=j.parts.filter(goesLive);
  return bar("Listings",`<span class="mono">${esc(j.details.jobNo)}</span> · office check before upload`,`<button data-act="backjob">Back</button>`)+`<main class="wrap">
  <p class="muted" style="margin:0">Titles and descriptions are drafted from the tech's answers. Edit anything here; changes are saved as you type and go out with the next send.</p>
  ${list.map(p=>`<section class="card"><div class="row"><span class="grow"><b>${esc(p.name)}</b><br><span class="mono muted small">${esc(p.id)}</span></span><span class="chip ${needsSend(p)?"s-prog":"s-done"}">${needsSend(p)?"To send":"Sent"}</span></div>
    <label class="f">Title<input type="text" data-list="title" data-uid="${p.uid}" value="${esc(p.title||autoTitle(j,p))}"></label>
    <label class="f">Description<textarea data-list="description" data-uid="${p.uid}">${esc(p.description||autoDesc(j,p))}</textarea></label>
    <div class="grid2"><label class="f">Price (£)<input type="number" inputmode="decimal" data-list="finalPrice" data-uid="${p.uid}" value="${esc(p.finalPrice||p.price)}"></label></div>
    <button class="btn" data-act="redraft" data-uid="${p.uid}">Redraft from tech's answers</button></section>`).join("")||`<section class="card"><p class="muted" style="margin:0">No parts are ready yet. A part is ready once it's done, has photos, and isn't Not present or Damaged grade D.</p></section>`}</main>`;
}

/* ---------- modals ---------- */
function mWho(){return `<div class="card"><h2>Who's working?</h2>${S.settings.techs.length?`<div class="choices c3">${S.settings.techs.map((t,i)=>`<button class="choice" data-act="pickme" data-i="${i}"><b>${esc(t.initials)}</b><span>${esc(t.name)}</span></button>`).join("")}</div>`:`<p class="muted" style="margin:0">Add your name once and the app fills in your initials on every part.</p>`}
  <div class="grid2"><label class="f">Name<input type="text" id="wname" autocomplete="off"></label><label class="f">Initials<input type="text" id="winit" maxlength="4" autocomplete="off"></label></div><button class="btn dark" data-act="addme">Add me</button></div>`}
function mExport(){const n=S.job.parts.filter(needsSend).length,held=S.job.parts.filter(p=>p.doneAt&&p.answers.photosToFollow).length;
  return `<div class="card"><h2>Send parts</h2>
  <button class="btn primary block" data-act="exp-new" ${n?"":"disabled"}>Send ${n} new part${n===1?"":"s"}</button><p class="muted small" style="margin:0">Finished parts not sent yet, plus any changed since. One zip: stock CSV and photos, ready to upload.${held?` ${held} part${held>1?"s are":" is"} held back waiting for photos.`:""}</p>
  <button class="btn block" data-act="exp-full">Download full job</button><p class="muted small" style="margin:0">Every part including Damaged and Not present, as a dismantle log CSV for your records, plus the stock CSV and all photos.</p>
  ${S.manager?`<button class="btn block" data-act="listings">Office: check titles and prices</button>`:`<p class="muted small" style="margin:0">Sign in as manager to check titles and prices.</p>`}
  <button class="btn block" data-act="close">Close</button></div>`}
function mExtra(){return `<div class="card"><h2>Request extra part</h2><p class="muted small" style="margin:0">For saleable parts that aren't on the list. A manager signs it off before you start.</p>
  <label class="f">Part<input type="search" id="xname" list="libnames" autocomplete="off" placeholder="Start typing, e.g. Mirror"></label><datalist id="libnames">${LIB.map(([n])=>`<option value="${esc(n)}">`).join("")}</datalist>
  <label class="f">Location<select id="xloc">${LOCATIONS.map(l=>`<option>${l}</option>`).join("")}</select></label>
  <label class="f">Why is it worth pulling?<textarea id="xwhy" style="min-height:90px"></textarea></label>
  <div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary grow" data-act="xsave">Request sign-off</button></div></div>`}
function mMgr(){return `<div class="card"><h2>Manager sign in</h2><p class="muted small" style="margin:0">Shows office notes and the titles and prices screen. Sign out before handing the tablet back.</p><label class="f">Manager PIN<input type="password" inputmode="numeric" id="mgpin" autocomplete="off"></label><p class="missing small" id="mgerr" hidden>That PIN isn't right.</p><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary grow" data-act="mgrok">Sign in</button></div></div>`}
function mApprove(p){return `<div class="card"><h2>Sign off extra part</h2><div class="info"><dl><dt>Part</dt><dd>${esc(p.name)}</dd><dt>Location</dt><dd>${esc(p.location)}</dd><dt>Requested by</dt><dd>${esc(p.extra.requestedBy)}</dd><dt>Reason</dt><dd>${esc(p.extra.reason)}</dd></dl></div>
  <label class="f">Manager name<input type="text" id="mname" autocomplete="off"></label><label class="f">Manager PIN<input type="password" inputmode="numeric" id="mpin" autocomplete="off"></label>
  <p class="missing small" id="merr" hidden>That PIN isn't right.</p>
  <div class="row"><button class="btn danger" data-act="xreject" data-uid="${p.uid}">Reject</button><button class="btn" data-act="close">Not now</button><button class="btn primary grow" data-act="xapprove" data-uid="${p.uid}">Approve</button></div></div>`}

function render(){
  const v=S.view;
  $app.innerHTML = v==="home"?vHome():v==="settings"?vSettings():v==="job"?vJob():v==="machine"?vMachine():v==="wizard"?vWizard():v==="listings"?vListings():"";
  if(S.modal){const m=document.createElement("div");m.className="modal";m.innerHTML=S.modal;$app.appendChild(m)}
  fillThumbs();
}
function afterWho(){if(S.job&&!S.job.details.assetType)modal(mAssetType());else closeModal()}
function modal(html){S.modal=html;render()}
function closeModal(){S.modal=null;render()}

/* ---------- actions ---------- */
async function openJob(id){S.job=S.jobs.find(j=>j.id===id);S.view="job";S.filter="todo";S.modal=S.settings.current?null:mWho();render()}
function persistPart(p){p.changedAt=Date.now();return saveJob(S.job).catch(()=>toast("Couldn't save on this tablet. Export soon."))}
const ACT = {
  home(){S.view="home";S.job=null;S.manager=false;render()},
  settings(){S.view="settings";render()},
  async addtech(){const n=document.getElementById("tname").value.trim(),i=document.getElementById("tinit").value.trim().toUpperCase();if(!n||!i){toast("Enter a name and initials");return}S.settings.techs.push({name:n,initials:i});await saveSettings();render()},
  async deltech(el){S.settings.techs.splice(+el.dataset.i,1);await saveSettings();render()},
  async setpin(){const v=document.getElementById("newpin").value.trim();if(!/^\d{4,8}$/.test(v)){toast("Use 4 to 8 digits");return}S.settings.pin=v;await saveSettings();toast("PIN saved");render()},
  import(){document.getElementById("xlsxfile").click()},
  async sample(){const j=sampleJob();await saveJob(j);S.jobs.push(j);openJob(j.id)},
  open(el){openJob(el.dataset.id)},
  whoami(){modal(mWho())},
  async pickme(el){S.settings.current=S.settings.techs[+el.dataset.i];await saveSettings();afterWho()},
  async addme(){const n=document.getElementById("wname").value.trim(),i=document.getElementById("winit").value.trim().toUpperCase();if(!n||!i){toast("Enter your name and initials");return}const t={name:n,initials:i};S.settings.techs.push(t);S.settings.current=t;await saveSettings();afterWho()},
  filter(el){S.filter=el.dataset.f;render()},
  machine(){S.view="machine";render()},
  settype(el){document.querySelectorAll("[data-detail]").forEach(i=>S.job.details[i.dataset.detail]=i.value.trim());S.job.details.assetType=el.dataset.t;saveJob(S.job);render()},
  async pickType(el){S.job.details.assetType=el.dataset.t;await saveJob(S.job);S.modal=null;S.view="machine";render()},
  async savemachine(){if(!S.job.details.assetType)S.job.details.assetType=assetType(S.job);document.querySelectorAll("[data-detail]").forEach(i=>S.job.details[i.dataset.detail]=i.value.trim());await saveJob(S.job);toast("Saved");S.view="job";render()},
  backjob(){S.view="job";S.modal=null;render()},
  part(el){const p=S.job.parts.find(x=>x.uid===el.dataset.uid);
    if(p.status==="pending"){modal(mApprove(p));return}
    if(p.status==="rejected"){toast("This extra part wasn't approved");return}
    if(!S.settings.current){modal(mWho());return}
    S.partUid=p.uid;S.step=p.doneAt?steps(p).length-1:0;S.timerStart=Date.now();S.view="wizard";render();window.scrollTo(0,0)},
  async closepart(){const p=curPart();stopTimer(p);await saveJob(S.job);S.view="job";render()},
  async ans(el){const p=curPart();p.answers[el.dataset.k]=el.dataset.v;persistPart(p);
    if(el.dataset.k==="status"&&S.step>=steps(p).length) S.step=steps(p).length-1;
    if(el.dataset.k!=="damageYN"||el.dataset.v==="no"){S.step=Math.min(S.step+1,steps(p).length-1)}
    render();window.scrollTo(0,0)},
  async setans(el){const p=curPart();p.answers[el.dataset.k]=el.dataset.v;persistPart(p);render()},
  async addobs(el){const p=curPart();const t=document.querySelector('[data-ans="obs"]');p.answers.obs=(t.value.trim()?t.value.trim()+". ":"")+el.dataset.v+": ";persistPart(p);render();const n=document.querySelector('[data-ans="obs"]');n.focus();n.setSelectionRange(n.value.length,n.value.length)},
  next(){const p=curPart();S.step=Math.min(S.step+1,steps(p).length-1);render();window.scrollTo(0,0)},
  back(){S.step=Math.max(0,S.step-1);render();window.scrollTo(0,0)},
  goto(el){S.step=+el.dataset.s;render();window.scrollTo(0,0)},
  shoot(){document.getElementById("camera").click()},
  async delphoto(el){const p=curPart();const k=p.photos.splice(+el.dataset.i,1)[0];await db.del("photos",k);persistPart(p);render()},
  async finish(){const p=curPart();const m=parseInt(document.getElementById("mins").value);stopTimer(p);if(m>=0)p.timeSecs=m*60;
    const first=!p.doneAt;p.doneAt=Date.now();if(first){p.dateRemoved=today();p.initials=S.settings.current?.initials||""}
    if(!S.job.details.start)S.job.details.start=today();
    if(S.job.parts.filter(isActive).every(x=>x.doneAt))S.job.details.complete=today();
    persistPart(p);S.view="job";render();toast(goesLive(p)?`${p.name} is ready to send`:`${p.name} saved`)},
  exportmenu(){modal(mExport())},
  close(){closeModal()},
  async "exp-new"(){S.modal=null;await exportJob("new")},
  async "exp-full"(){S.modal=null;render();await exportJob("full")},
  listings(){if(!S.manager)return;S.modal=null;S.view="listings";render()},
  mgr(){if(S.manager){S.manager=false;if(S.view==="listings")S.view="job";render();toast("Manager signed out");return}modal(mMgr())},
  mgrok(){const pin=document.getElementById("mgpin").value.trim();if(pin!==S.settings.pin){document.getElementById("mgerr").hidden=false;return}S.manager=true;closeModal();toast("Manager signed in")},
  async addsalvage(){const p=curPart();const n=document.getElementById("sname").value.trim();if(!n){toast("Name the part to remove");return}
    const lib=LIB.find(([x])=>x.toLowerCase()===n.toLowerCase());const line=Math.max(0,...S.job.parts.map(x=>x.line||0))+1;
    S.job.parts.push(newPart(S.job,line,{name:lib?lib[0]:n,category:lib?lib[1]:p.category,location:p.location,priority:p.priority,salvagedFrom:p.uid}));
    persistPart(p);render();toast(`Added ${lib?lib[0]:n} to the work order`)},
  async redraft(el){const p=S.job.parts.find(x=>x.uid===el.dataset.uid);p.title="";p.description="";persistPart(p);render()},
  extra(){if(!S.settings.current){modal(mWho());return}modal(mExtra())},
  async xsave(){const n=document.getElementById("xname").value.trim(),why=document.getElementById("xwhy").value.trim();if(!n||!why){toast("Name the part and say why");return}
    const lib=LIB.find(([x])=>x.toLowerCase()===n.toLowerCase());
    const p=newPart(S.job,0,{name:lib?lib[0]:n,category:lib?lib[1]:"",location:document.getElementById("xloc").value,status:"pending",extra:{reason:why,requestedBy:S.settings.current.name,requestedAt:Date.now()}});
    S.job.parts.push(p);await saveJob(S.job);S.modal=null;S.filter="todo";render();toast("Sent for sign-off")},
  async xapprove(el){const p=S.job.parts.find(x=>x.uid===el.dataset.uid);const pin=document.getElementById("mpin").value.trim(),nm=document.getElementById("mname").value.trim();
    if(pin!==S.settings.pin){document.getElementById("merr").hidden=false;return}
    const line=Math.max(0,...S.job.parts.map(x=>x.line||0))+1;p.line=line;p.id=S.job.details.jobNo+"-"+pad3(line);p.status="active";p.extra.approvedBy=nm||"Manager";p.extra.approvedAt=Date.now();
    await saveJob(S.job);closeModal();toast(`Approved as ${p.id}`)},
  async xreject(el){const p=S.job.parts.find(x=>x.uid===el.dataset.uid);const pin=document.getElementById("mpin").value.trim();if(pin!==S.settings.pin){document.getElementById("merr").hidden=false;return}
    p.status="rejected";await saveJob(S.job);closeModal()}
};
$app.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();Promise.resolve(f(el)).catch(err=>toast(err.message||"Something went wrong"))}});
let inputTimer=null;
$app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.ans){const p=curPart();p.answers[t.dataset.ans]=t.value;clearTimeout(inputTimer);inputTimer=setTimeout(()=>persistPart(p),400);
    const ss=steps(p),st=ss[S.step],nb=document.querySelector('[data-act="next"]');if(nb)nb.disabled=!stepValid(p,st)}
  if(t.dataset.list){const p=S.job.parts.find(x=>x.uid===t.dataset.uid);p[t.dataset.list]=t.value;clearTimeout(inputTimer);inputTimer=setTimeout(()=>persistPart(p),400)}
});
$app.addEventListener("change",async e=>{const t=e.target;if(t.dataset.ansCheck){const p=curPart();p.answers[t.dataset.ansCheck]=t.checked;if(t.dataset.ansCheck==="oemNone"&&t.checked)p.answers.oem="";persistPart(p);render()}});
document.getElementById("camera").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const p=curPart();if(!p)return;
  try{const b=await resizePhoto(f);const k=`${S.job.id}/${p.uid}/${uid()}`;await db.put("photos",k,b);p.photos=p.photos||[];p.photos.push(k);persistPart(p);render()}catch(err){toast(err.message)}
});
document.getElementById("xlsxfile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{toast("Reading spreadsheet…");const j=await importWorkbook(f);await saveJob(j);S.jobs.push(j);toast(`Loaded ${j.parts.length} parts`);await openJob(j.id);if(S.settings.current)modal(mAssetType())}catch(err){toast(err.message||"Couldn't read that file")}
});

(async function boot(){
  try{ if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register("sw.js"); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  idb=await openDB();
  try{const s=await db.get("kv","settings");if(s)S.settings=Object.assign(S.settings,s)}catch(e){}
  try{S.jobs=(await db.all("jobs"))||[]}catch(e){S.jobs=[]}
  render();
})();
</script>
</body></html>
